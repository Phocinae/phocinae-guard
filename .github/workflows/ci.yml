# CI for phocinae-guard.
#
# Zero third-party dependencies: every suite below is a plain
# `python <file>.py` runner that prints its own summary and exits non-zero on
# failure (no pytest, nothing to pip install, nothing to build).
#
# PYTHONUTF8=1 is load-bearing on Windows, not cosmetic.
# `tests/test_bypass_regression.py` runs guard.py through
# `subprocess.run(..., capture_output=True, text=True)` and never passes
# `encoding=`, so Python's text mode decodes the child with the *locale*
# encoding. guard.py's verdict line is UTF-8 JSON whose `reason` field is
# Chinese ("L0 黑名单 rm_system：…"), so on a Windows box whose ANSI code page is
# not UTF-8 the reader thread dies with
#   UnicodeDecodeError: 'gbk' codec can't decode byte 0x95 in position 152
# and proc.stdout comes back as None. The suite then reports
#   BYPASS-REGRESSION: pass=18 fail=13
# with the real failures hidden behind
#   AttributeError: 'NoneType' object has no attribute 'strip'
# (the test's own failure-detail formatter calls out.strip() on that None).
# Reproduced on the authoring machine (cp936): without PYTHONUTF8 -> pass=18
# fail=13; with PYTHONUTF8=1 -> pass=110 fail=0. Setting it here rather than
# patching the test keeps the fix in CI config, where it belongs: the suite's
# intent (UTF-8 all the way down) is already documented inside the test, which
# sets PYTHONIOENCODING=utf-8 for the child. On ubuntu/macos the runner locale
# is already UTF-8, so the variable is a no-op there.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'

jobs:
  test:
    name: fast suites (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Must print: ACCEPTANCE: benign=15 miss=0 (<=1) | dangerous=24 false_allow=0 (=0)
      # (that line goes to stderr, so it shows up first in the combined log)
      - name: L0 acceptance battery
        run: python test_guard.py

      # Must print: BYPASS-REGRESSION: pass=N fail=0
      - name: Bypass / regression suite (B3 / B4 / B13 / B16)
        run: python tests/test_bypass_regression.py

      # The suites above exercise guard.py and the L0 layer; neither reads
      # .claude-plugin/plugin.json or hooks/hooks.json, and neither checks the
      # Claude Code hook exit-code contract. So a renamed manifest key, a broken
      # hooks.json, or a wrong exit code could ship with every suite green — the
      # plugin would simply fail to load for users. This is the only check that
      # covers the plugin packaging and the hook chain end to end (16 assertions).
      #
      # shell: bash is required: the script is POSIX, and a Windows runner's
      # default PowerShell cannot parse it (the same mistake that turned the
      # parity step in phocinae-cli red on Windows only).
      #
      # It exits 0 on SKIP, 1 on any FAIL, so a busy port 8155 cannot mask a
      # failure; the L1 section skips only when it cannot bind 8155, and the
      # remaining 12 assertions still run and still gate.
      - name: Claude Code plugin self-test (manifest + hook chain)
        shell: bash
        run: bash tests/cc_plugin_self_test.sh

      # The write layer and the remediation table each have a failure mode that
      # no other suite can see.
      #
      # The hook used to read only `tool_input.command`. Widening the matcher to
      # Write/Edit/MCP without widening the hook would make every one of those
      # calls take the "no command" branch and return *no decision*, which the
      # host reads as "continue to the normal permission flow" -- the gate would
      # silently not exist for exactly the tools it had just been extended to
      # cover. This suite drives the real hook over stdin, so it tests the wiring.
      - name: Write layer (hook judges Write/Edit/MultiEdit/MCP)
        run: python tests/test_write_layer.py

      # A table of "suggested alternatives" attached to a security gate has an
      # obvious failure mode: if any suggested command is itself dangerous, the
      # table becomes a documented way around the gate. R7 asserts that no
      # `instead` command trips the blacklist.
      - name: Remediation table (no suggested alternative trips the blacklist)
        run: python tests/test_remediation.py

  fuzz:
    name: fuzz / robustness (py3.12 on ${{ matrix.os }})
    # ~98 s of wall clock measured locally, so it does not pay for itself on
    # every push: it runs on main (post-merge signal) and on an explicit
    # workflow_dispatch. The fast suites above still gate every push and PR.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ~100 s; prints PASS=/FAIL= and exits non-zero on any failure.
      - name: Fuzz / robustness suite
        run: python tests/fuzz_robustness.py
